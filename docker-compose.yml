services:
  api:
    build: .
    container_name: ai_codegen_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./generated_projects:/app/generated_projects
      - ./chroma_data:/app/chroma_data
      - C:/Users/Admin/Downloads/download_ai_project:/home/app/downloads
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: ai_codegen_worker
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    volumes:
      - .:/app
      - ./generated_projects:/app/generated_projects
      - ./chroma_data:/app/chroma_data
      - C:/Users/Admin/Downloads/download_ai_project:/home/app/downloads
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: ai_codegen_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_codegen_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
